<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0E1B">
<title>Gửi tới người bạn đặc biệt của tôi</title>

<!-- Xem trước khi gửi link qua Messenger / Zalo / iMessage -->
<meta property="og:title" content="Có một bức thư dành cho Trinh">
<meta property="og:description" content="Chạm để mở.">
<meta property="og:type" content="website">

<!--
  ─────────────────────────────────────────────
  NHẠC NỀN
  Đặt file nhạc cùng thư mục với file này và đổi tên thành: music.mp3
  Hoặc sửa giá trị MUSIC_FILE ở đầu phần <script> bên dưới.
  Nhạc bắt đầu ngay khi người xem chạm vào màn hình mở thư.
  ─────────────────────────────────────────────
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --night-1:#171B2E;
    --night-2:#0B0E1B;
    --paper:#F4EFE4;
    --paper-edge:#E4DBC9;
    --ink:#2A2E3F;
    --ink-soft:#6E7288;
    --air-red:#B23A48;
    --air-blue:#3A5FA8;
    --dur:900ms;
    --ease:cubic-bezier(.42,.02,.18,1);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{height:100%; overscroll-behavior:none;}
  body{
    background:
      radial-gradient(120% 90% at 50% 12%, #23294180 0%, transparent 60%),
      radial-gradient(100% 80% at 50% 100%, #1d2338 0%, transparent 70%),
      linear-gradient(160deg, var(--night-1), var(--night-2));
    background-color:var(--night-2);
    color:var(--paper);
    font-family:'Lora', Georgia, 'Times New Roman', serif;
    overflow:hidden;
    position:fixed; inset:0;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
  }

  /* ── màn hình mở thư ────────────────────── */
  .opener{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:30px; text-align:center; cursor:pointer;
    padding:calc(var(--safe-t) + 24px) 30px calc(var(--safe-b) + 24px);
    background:var(--night-2);
    background-image:
      radial-gradient(120% 90% at 50% 40%, #24294180 0%, transparent 62%),
      linear-gradient(160deg, var(--night-1), var(--night-2));
    transition:opacity 900ms var(--ease), visibility 900ms;
  }
  .opener.gone{opacity:0; visibility:hidden; pointer-events:none;}

  .envelope{width:74px; color:var(--paper); opacity:.85;}
  .envelope .flap{
    transform-origin:20px 12px;
    animation:flap 4.5s var(--ease) infinite;
  }
  @keyframes flap{
    0%,62%,100%{transform:rotateX(0deg)}
    76%,88%{transform:rotateX(-26deg)}
  }
  .opener h2{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:400; font-size:clamp(23px,6.4vw,32px);
    letter-spacing:.01em; line-height:1.4; max-width:14em;
  }
  .opener .cta{
    font-size:12px; letter-spacing:.24em; opacity:.55;
    padding-bottom:7px; border-bottom:1px solid #F4EFE455;
  }
  .opener .note{font-size:11px; letter-spacing:.1em; opacity:.3; font-style:italic;}

  /* ── sân khấu ───────────────────────────── */
  .stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    perspective:2400px;
    opacity:0; transition:opacity 900ms 250ms var(--ease);
  }
  body.opened .stage{opacity:1;}

  .book{
    position:relative;
    width:min(90vw, calc(80vh * 0.715), 540px);
    width:min(90vw, calc(80dvh * 0.715), 540px);
    aspect-ratio:5 / 7;
    transform-style:preserve-3d;
  }

  .stack{position:absolute; inset:0; border-radius:3px 9px 9px 3px;
         background:var(--paper-edge); box-shadow:0 30px 60px -20px #00000099;}
  .stack:nth-child(1){transform:translate(5px,6px) rotate(.5deg); opacity:.35;}
  .stack:nth-child(2){transform:translate(2px,3px) rotate(-.3deg); opacity:.55;}

  /* ── một tờ giấy ────────────────────────── */
  .leaf{
    position:absolute; inset:0;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform var(--dur) var(--ease);
    will-change:transform;
  }
  .leaf.flipped{transform:rotateY(-178deg);}

  .face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:3px 9px 9px 3px;
    overflow:hidden;
    background:
      radial-gradient(120% 100% at 0% 50%, #EFE7D8 0%, transparent 55%),
      linear-gradient(180deg,#F6F1E7,#EFE8DA);
    box-shadow:0 26px 54px -18px #000000b3, 0 1px 0 #ffffff80 inset;
    opacity:1;
    transition:opacity 10ms linear;
  }
  .leaf.flipped .face{opacity:0; transition:opacity 160ms 700ms linear;}
  .face.back{transform:rotateY(180deg); border-radius:9px 3px 3px 9px;}

  .face::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>");
    opacity:.05; mix-blend-mode:multiply;
  }
  .face::after{
    content:""; position:absolute; left:0; top:0; bottom:0; width:34px; pointer-events:none;
    background:linear-gradient(90deg,#00000024,#0000000d 40%,transparent);
  }

  .shade{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(90deg,#1b1408cc,#1b140833 45%,transparent 75%);
    opacity:0; transition:opacity var(--dur) var(--ease);
  }
  .leaf.flipped .front .shade{opacity:.55;}
  .back .shade{background:linear-gradient(270deg,#1b140899,#1b140822 40%,transparent 70%); opacity:.5;}
  .leaf.flipped .back .shade{opacity:0;}

  .back .verso{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .back .verso svg{width:52px; opacity:.14;}

  /* ── nội dung trang ─────────────────────── */
  .sheet{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    padding:clamp(30px,7.5%,62px) clamp(26px,8%,58px);
  }
  .content{
    color:var(--ink);
    font-size:clamp(15.5px,2.85vw,19px);
    line-height:2.05;
    max-width:34em;
    opacity:0; transform:translateY(10px); filter:blur(5px);
    transition:opacity 240ms ease, transform 240ms ease, filter 240ms ease;
  }
  .leaf.current .content{
    opacity:1; transform:none; filter:blur(0);
    transition:opacity 800ms 420ms ease, transform 900ms 420ms var(--ease), filter 800ms 420ms ease;
  }
  .content p{text-wrap:pretty;}

  .t-accent .content{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:clamp(23px,5.6vw,34px);
    line-height:1.5; color:#242838; max-width:15em;
  }

  .t-quote .content{max-width:16em;}
  .t-quote .quote{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic; font-weight:500;
    font-size:clamp(24px,5.8vw,36px);
    line-height:1.45; color:#242838; position:relative;
  }
  .t-quote .quote::before{
    content:"“"; position:absolute; left:-.42em; top:-.18em;
    font-size:2.2em; line-height:1; color:var(--air-red); opacity:.5;
  }
  .t-quote .tail{
    margin-top:1.5em; font-size:clamp(14px,2.6vw,16.5px);
    color:var(--ink-soft); font-style:normal;
  }

  /* ── trang bìa & trang cuối ─────────────── */
  .airmail{
    position:absolute; inset:0; pointer-events:none; padding:11px;
    background:
      repeating-linear-gradient(45deg,
        var(--air-red) 0 9px, transparent 9px 18px,
        var(--air-blue) 18px 27px, transparent 27px 36px);
    -webkit-mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    opacity:.8;
  }
  .t-cover .sheet, .t-final .sheet{align-items:center; text-align:center;}
  .t-cover .content, .t-final .content{max-width:none;}

  .cover-mark{margin-bottom:34px;}
  .cover-mark svg{width:44px; color:var(--air-blue); opacity:.75;}
  .t-cover h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:500; color:#242838;
    font-size:clamp(29px,7vw,46px);
    line-height:1.28; max-width:11em;
  }
  .cover-sub{margin-top:30px; font-size:clamp(12px,2.4vw,13.5px); color:var(--ink-soft);
             letter-spacing:.14em; font-style:italic;}
  .cover-rule{width:44px; height:1px; background:var(--ink-soft); opacity:.4; margin:26px auto 0;}

  .t-final .content{font-family:'Cormorant Garamond', Georgia, serif;}
  .final-line{font-size:clamp(28px,6.6vw,42px); font-weight:500; color:#242838; line-height:1.4;}
  .cjk{display:block; margin-top:.55em;
       font-family:'Noto Serif SC','Songti SC','PingFang SC','Microsoft YaHei','Cormorant Garamond',serif;
       color:var(--air-red); letter-spacing:.06em;}

  .folio{position:absolute; left:0; right:0; bottom:clamp(16px,3.6%,26px);
         text-align:center; font-size:11.5px; letter-spacing:.22em;
         color:var(--ink-soft); opacity:.55;}
  .t-cover .folio{display:none;}

  /* ── vùng bấm ───────────────────────────── */
  .zones{position:fixed; inset:0; z-index:10; display:flex;}
  .zone{flex:1; cursor:pointer; position:relative;}
  .zone::after{
    content:""; position:absolute; top:50%; width:9px; height:9px;
    border-top:1.5px solid #F4EFE4; border-right:1.5px solid #F4EFE4;
    opacity:0; transition:opacity .35s ease, transform .35s ease;
  }
  .zone-prev::after{left:calc(var(--safe-l) + 16px); transform:translateY(-50%) rotate(-135deg) translateX(4px);}
  .zone-next::after{right:calc(var(--safe-r) + 16px); transform:translateY(-50%) rotate(45deg) translateX(4px);}
  @media (hover:hover){
    .zone:hover::after{opacity:.45; transform:translateY(-50%) rotate(-135deg) translateX(0);}
    .zone-next:hover::after{transform:translateY(-50%) rotate(45deg) translateX(0);}
  }
  .zone.off{cursor:default;}
  .zone.off::after{display:none;}

  /* ── thanh tiến trình ───────────────────── */
  .progress{
    position:fixed; left:50%; bottom:calc(var(--safe-b) + 22px); transform:translateX(-50%);
    z-index:20; display:flex; align-items:center; gap:14px;
    font-size:11px; letter-spacing:.2em; color:#F4EFE4; opacity:0;
    pointer-events:none; transition:opacity 700ms 600ms ease;
  }
  body.opened .progress{opacity:.42;}
  .bar{width:min(30vw,150px); height:1px; background:#F4EFE499; position:relative;}
  .bar i{position:absolute; left:0; top:-1px; height:3px; background:var(--paper);
         width:0; transition:width var(--dur) var(--ease);}

  /* ── nút nhạc ───────────────────────────── */
  .music{
    position:fixed; top:calc(var(--safe-t) + 16px); right:calc(var(--safe-r) + 18px); z-index:30;
    display:flex; align-items:center; gap:9px;
    background:none; border:0; cursor:pointer; padding:10px;
    color:#F4EFE4; opacity:0; transition:opacity .5s ease;
    font-family:inherit; pointer-events:none;
  }
  body.opened .music{opacity:.45; pointer-events:auto;}
  body.opened .music:hover, body.opened .music:focus-visible{opacity:.95;}
  .eq{display:flex; align-items:flex-end; gap:2.5px; height:14px;}
  .eq span{width:2px; height:4px; background:currentColor; display:block;}
  .music.playing .eq span{animation:eq 1.1s ease-in-out infinite;}
  .music.playing .eq span:nth-child(2){animation-delay:.18s}
  .music.playing .eq span:nth-child(3){animation-delay:.36s}
  .music.playing .eq span:nth-child(4){animation-delay:.54s}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}
  .music-label{font-size:10.5px; letter-spacing:.16em;}

  .hint{
    position:fixed; left:50%; bottom:calc(var(--safe-b) + 62px); transform:translateX(-50%);
    z-index:20; font-size:11.5px; letter-spacing:.16em; color:#F4EFE4;
    opacity:0; pointer-events:none; white-space:nowrap; text-align:center;
  }
  body.opened .hint{animation:hint 7s 1.2s ease forwards;}
  @keyframes hint{0%{opacity:0}16%{opacity:.5}72%{opacity:.5}100%{opacity:0}}

  .restart{
    position:fixed; left:50%; bottom:calc(var(--safe-b) + 60px); transform:translateX(-50%) translateY(6px);
    z-index:25; background:none; border:0; cursor:pointer; font-family:inherit;
    color:#F4EFE4; font-size:11.5px; letter-spacing:.16em; padding:8px 4px;
    border-bottom:1px solid #F4EFE466;
    opacity:0; pointer-events:none; transition:opacity .5s .4s ease, transform .5s .4s ease;
  }
  .restart.show{opacity:.62; transform:translateX(-50%) translateY(0); pointer-events:auto;}

  :focus-visible{outline:1px solid #F4EFE4; outline-offset:4px;}

  @media (prefers-reduced-motion:reduce){
    .leaf{transition:opacity 320ms ease;}
    .leaf.flipped{transform:none;}
    .leaf.flipped .face{opacity:0; transition:opacity 300ms linear;}
    .shade{display:none;}
    .envelope .flap{animation:none;}
    .music.playing .eq span{animation:none; height:9px;}
  }
</style>
</head>
<body>

<div class="opener" id="opener">
  <svg class="envelope" viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="1.1"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="2" y="4" width="36" height="24" rx="1.5"/>
    <path class="flap" d="M2 5.5l18 13 18-13"/>
  </svg>
  <h2>Có một bức thư dành cho Trinh</h2>
  <div class="cta">Chạm để mở</div>
  <div class="note">nhớ bật âm lượng nhé</div>
</div>

<div class="stage">
  <div class="book" id="book">
    <div class="stack"></div>
    <div class="stack"></div>
  </div>
</div>

<div class="zones">
  <div class="zone zone-prev" id="zonePrev" aria-hidden="true"></div>
  <div class="zone zone-next" id="zoneNext" aria-hidden="true"></div>
</div>

<div class="progress">
  <span id="folioNow">01</span>
  <span class="bar"><i id="barFill"></i></span>
  <span id="folioAll">20</span>
</div>

<p class="hint">Chạm nửa phải để sang trang · nửa trái để quay lại</p>
<button class="restart" id="restart">Đọc lại từ đầu</button>

<button class="music" id="musicBtn" aria-label="Bật hoặc tắt nhạc nền">
  <span class="eq"><span></span><span></span><span></span><span></span></span>
  <span class="music-label" id="musicLabel">Nhạc</span>
</button>

<audio id="bgm" loop preload="auto" playsinline></audio>

<script>
/* ══ Tên file nhạc ══ */
const MUSIC_FILE = "music.mp3";

/* ══ Nội dung thư: mỗi phần tử là một trang ══ */
const pages = [
  { type:"cover", text:"Gửi tới người bạn đặc biệt của tôi" },

  { text:"Đã bao lâu rồi, mình không nói chuyện nhỉ? Đã có thể tính bằng năm chưa ta? Ui trời.. nghe mà thấy.. buồn ghê... Trinh nhở?" },

  { text:"Lần đầu tiên gặp Trinh trên chuyến xe năm ấy, tôi không nghĩ là tụi mình có thể nói chuyện với nhau được nhiều như vậy đâu. À nhân đây nói với Trinh một bí mật, hôm ấy Trinh tựa vào vai tôi, tôi ngại lắm nên phải vờ ngủ gật để tránh sượng trân đó haha." },

  { type:"accent", text:"Hmm.. ấn tượng đầu tiên của tôi về Trinh ấy à?" },

  { type:"quote",
    quote:"Một gương mặt dễ thương, nhưng lại mang một đôi mắt sắc sảo",
    tail:"tôi đã nghĩ như vậy đó." },

  { type:"accent", text:"Rồi thời gian cứ trôi, hình như là hơn 3 năm rồi đấy Trinh ạ." },

  { text:"Một chặng đường dài với nhiều thật nhiều chuyện đi qua, Trinh cũng đã trưởng thành hơn nhiều rồi nhỉ? Có mạnh mẽ hơn, có bao dung hơn và cũng có chín chắn hơn rất nhiều." },

  { type:"accent", text:"Về phần tôi ấy à?" },

  { text:"Có chứ, Trinh đã giúp tôi nhiều lắm đấy. Trinh đã cho một con người cứng nhắc như tôi biết như thế nào là ý nghĩa của việc thả trôi theo cảm xúc, cho tôi biết rằng nguyên tắc dù là đúng, nhưng không phải lúc nào cũng đem đến hiệu ứng tích cực." },

  { type:"accent", text:"Cảm ơn Trinh vì tất cả nhé!" },

  { text:"Cảm ơn Trinh vì đã chịu trò chuyện với tôi, và cho phép tôi được đồng hành cùng Trinh trong chặng đường vừa qua. Cảm ơn vì đã tìm đến tôi những lúc Trinh thấy buồn. Và cảm ơn vì Trinh đã luôn nói đến tôi như một người quan trọng nhé." },

  { type:"accent", text:"Tôi rất vui và biết ơn điều đó lắm đấy." },

  { text:"Trước một hành trình mới sắp tới, không biết Trinh có những lo lắng nào vậy ta?" },

  { text:"Nhưng tôi tin, dù đó có là gì, thì Trinh cũng sẽ xử lý ổn thỏa mà thôi. Vì Trinh là Trinh cơ mà." },

  { text:"Nhưng mà này, một câu văn quá dài, sẽ làm con người ta thấy quá tải đó, nên là thi thoảng hãy nhớ cho bản thân mình một dấu “phẩy” Trinh nhé." },

  { type:"accent", text:"Tôi không phải một người đưa ra lời chúc giỏi, nhưng mà.." },

  { text:"Sức khỏe, sức khỏe, sức khỏe mới là điều quan trọng nhất. Tôi đã được dạy như vậy đó. Và tôi mong là Trinh cũng tin vào điều này. Hãy giữ gìn bản thân luôn khỏe mạnh, Trinh nhé." },

  { text:"Chúc Trinh dù ở nơi đâu, dù đứng trước bão giông như thế nào, vẫn sẽ luôn vững vàng và tràn đầy năng lượng. Hãy luôn nhớ, dù có lúc cả vũ trụ này quay lưng và chống đối, thì Trinh vẫn luôn có một đội ngũ đứng sau và luôn ủng hộ Trinh nha. Đừng quên điều đó đấy." },

  { text:"Và cuối cùng thì.. tôi mong rằng dù cho đối thủ có là sóng lớn, hay biển lửa, thì mọi thứ cũng sẽ đều đối xử với Trinh thật dịu dàng." },

  { type:"final", text:"Trinh cố lên nhé!", cjk:"加油 !!!" }
];

const eiffel = `<svg viewBox="0 0 60 100" fill="none" stroke="currentColor" stroke-width="1.4"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M30 5v9"/>
  <path d="M20.5 91C24 62 27 40 30 14c3 26 6 48 9.5 77"/>
  <path d="M24.6 58h10.8M22.4 73h15.2"/>
  <path d="M25.5 91c1.6-6 7.4-6 9 0"/>
  <path d="M14 91h32"/>
</svg>`;

const seal = `<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M4 12h32v20H4z"/><path d="M4 12l16 12 16-12"/>
</svg>`;

/* ══ Dựng các trang ══ */
const book = document.getElementById("book");
const leaves = [];
const total = pages.length;

pages.forEach((p, i) => {
  const leaf = document.createElement("div");
  leaf.className = "leaf t-" + (p.type || "text");

  let inner;
  if (p.type === "cover") {
    inner = `<div class="airmail"></div>
      <div class="sheet"><div class="content">
        <div class="cover-mark">${eiffel}</div>
        <h1>${p.text}</h1>
        <div class="cover-rule"></div>
        <div class="cover-sub">bon voyage, Trinh</div>
      </div></div>`;
  } else if (p.type === "final") {
    inner = `<div class="airmail"></div>
      <div class="sheet"><div class="content">
        <div class="final-line">${p.text}<span class="cjk">${p.cjk}</span></div>
      </div></div>`;
  } else if (p.type === "quote") {
    inner = `<div class="sheet"><div class="content">
        <div class="quote">${p.quote}”</div>
        <div class="tail">${p.tail}</div>
      </div></div>`;
  } else {
    inner = `<div class="sheet"><div class="content"><p>${p.text}</p></div></div>`;
  }

  const folio = p.type === "cover" ? "" :
    `<div class="folio">${String(i + 1).padStart(2, "0")}</div>`;

  leaf.innerHTML = `
    <div class="face front">${inner}${folio}<div class="shade"></div></div>
    <div class="face back"><div class="verso">${seal}</div><div class="shade"></div></div>`;

  book.appendChild(leaf);
  leaves.push(leaf);
});

/* ══ Lật trang ══ */
let index = 0, busy = false, opened = false;

const zonePrev = document.getElementById("zonePrev");
const zoneNext = document.getElementById("zoneNext");
const folioNow = document.getElementById("folioNow");
const barFill  = document.getElementById("barFill");
const restart  = document.getElementById("restart");
document.getElementById("folioAll").textContent = String(total).padStart(2, "0");

function render(){
  leaves.forEach((leaf, i) => {
    const flipped = i < index;
    leaf.classList.toggle("flipped", flipped);
    leaf.classList.toggle("current", i === index);
    leaf.style.zIndex = flipped ? 100 + i : 100 - i;
  });
  folioNow.textContent = String(index + 1).padStart(2, "0");
  barFill.style.width = ((index + 1) / total * 100) + "%";
  zonePrev.classList.toggle("off", index === 0);
  zoneNext.classList.toggle("off", index === total - 1);
  restart.classList.toggle("show", index === total - 1);
}

function go(step){
  if (!opened) return;
  const next = index + step;
  if (busy || next < 0 || next >= total) return;
  busy = true; index = next; render();
  setTimeout(() => { busy = false; }, 460);
}

zoneNext.addEventListener("click", () => go(1));
zonePrev.addEventListener("click", () => go(-1));

restart.addEventListener("click", (e) => {
  e.stopPropagation();
  if (busy) return;
  busy = true; index = 0; render();
  setTimeout(() => { busy = false; }, 700);
});

document.addEventListener("keydown", (e) => {
  if (!opened && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openLetter(); return; }
  if (["ArrowRight","ArrowDown"," ","PageDown","Enter"].includes(e.key)){ e.preventDefault(); go(1); }
  if (["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ e.preventDefault(); go(-1); }
});

/* vuốt ngang trên điện thoại */
let tx = 0, ty = 0, swiped = false;
const zones = document.querySelector(".zones");
zones.addEventListener("touchstart", (e) => {
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; swiped = false;
}, {passive:true});
zones.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){ swiped = true; go(dx < 0 ? 1 : -1); }
}, {passive:true});
zones.addEventListener("click", (e) => { if (swiped){ e.stopPropagation(); swiped = false; } }, true);

render();

/* ══ Nhạc nền ══ */
const bgm      = document.getElementById("bgm");
const musicBtn = document.getElementById("musicBtn");
const musicLbl = document.getElementById("musicLabel");
let ready = true, wantMusic = true;

bgm.src = MUSIC_FILE;
bgm.volume = 0;
bgm.addEventListener("error", () => {
  ready = false;
  musicLbl.textContent = "Không có nhạc";
});

function fadeIn(target){
  const step = () => {
    if (bgm.volume < target - 0.02){
      bgm.volume = Math.min(target, bgm.volume + 0.02);
      setTimeout(step, 110);
    } else { bgm.volume = target; }
  };
  step();
}

/* Đưa âm thanh qua Web Audio để iPhone ở chế độ im lặng vẫn có tiếng.
   Nếu trình duyệt không hỗ trợ thì bỏ qua, nhạc vẫn phát bình thường. */
function routeThroughWebAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    ctx.resume().then(() => {
      if (ctx.state !== "running") return;
      const src = ctx.createMediaElementSource(bgm);
      src.connect(ctx.destination);
    }).catch(() => {});
  }catch(e){}
}

function startMusic(){
  if (!wantMusic || !ready || !bgm.paused) return;
  bgm.play().then(() => {
    musicBtn.classList.add("playing");
    musicLbl.textContent = "Đang phát";
    routeThroughWebAudio();
    fadeIn(0.55);
  }).catch(() => {
    musicLbl.textContent = "Bật nhạc";
  });
}

musicBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (!ready) return;
  if (bgm.paused){
    wantMusic = true; startMusic();
  } else {
    bgm.pause(); wantMusic = false;
    musicBtn.classList.remove("playing");
    musicLbl.textContent = "Đã tắt";
  }
});

/* ══ Mở thư ══ */
const opener = document.getElementById("opener");

function openLetter(){
  if (opened) return;
  opened = true;
  startMusic();                       /* chạy ngay trong cú chạm của người dùng */
  opener.classList.add("gone");
  document.body.classList.add("opened");
  render();
}

opener.addEventListener("click", openLetter);
</script>
